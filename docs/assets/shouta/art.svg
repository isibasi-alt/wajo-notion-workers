<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#FFF4D6"/>
    <stop offset="1" stop-color="#FFD27A"/>
  </linearGradient>
  <linearGradient id="suit" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#244a78"/>
    <stop offset="1" stop-color="#16314f"/>
  </linearGradient>
  <linearGradient id="hair" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#34384a"/>
    <stop offset="1" stop-color="#23263a"/>
  </linearGradient>
  <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#FFE39A" stop-opacity="0.95"/>
    <stop offset="1" stop-color="#FFE39A" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#F8CDA2"/>
    <stop offset="1" stop-color="#EFBA8B"/>
  </linearGradient>
</defs>

<!-- background -->
<rect x="0" y="0" width="720" height="720" fill="url(#bg)"/>

<!-- sun glow + rays behind head -->
<circle cx="360" cy="300" r="300" fill="url(#sun)"/>
<g stroke="#FDB94A" stroke-width="14" stroke-linecap="round" opacity="0.55">
  <line x1="360" y1="70"  x2="360" y2="120"/>
  <line x1="190" y1="140" x2="222" y2="178"/>
  <line x1="530" y1="140" x2="498" y2="178"/>
  <line x1="120" y1="300" x2="172" y2="300"/>
  <line x1="600" y1="300" x2="548" y2="300"/>
  <line x1="158" y1="455" x2="200" y2="425"/>
  <line x1="562" y1="455" x2="520" y2="425"/>
</g>

<!-- shoulders / suit -->
<path d="M150 720 C150 560 250 500 360 500 C470 500 570 560 570 720 Z" fill="url(#suit)"/>
<!-- shirt V -->
<path d="M300 512 L360 600 L420 512 Z" fill="#ffffff"/>
<!-- collar -->
<path d="M300 512 L360 560 L330 512 Z" fill="#eef2f6"/>
<path d="M420 512 L360 560 L390 512 Z" fill="#eef2f6"/>
<!-- tie (sun-orange = 和上カラー) -->
<path d="M360 560 L344 580 L360 690 L376 580 Z" fill="#F6A23A"/>
<path d="M348 566 L372 566 L360 582 Z" fill="#E8861C"/>
<!-- lapel sun pin -->
<circle cx="250" cy="595" r="15" fill="#FFC83D"/>
<g stroke="#FFC83D" stroke-width="4" stroke-linecap="round">
  <line x1="250" y1="568" x2="250" y2="576"/>
  <line x1="250" y1="614" x2="250" y2="622"/>
  <line x1="223" y1="595" x2="231" y2="595"/>
  <line x1="269" y1="595" x2="277" y2="595"/>
</g>
<circle cx="250" cy="595" r="7" fill="#FFE39A"/>

<!-- neck -->
<rect x="332" y="430" width="56" height="90" rx="22" fill="#EAB184"/>

<!-- ears -->
<ellipse cx="244" cy="312" rx="22" ry="30" fill="url(#skin)"/>
<ellipse cx="476" cy="312" rx="22" ry="30" fill="url(#skin)"/>

<!-- head -->
<ellipse cx="360" cy="300" rx="120" ry="128" fill="url(#skin)"/>

<!-- hair -->
<path d="M243 300 C238 196 300 150 360 150 C420 150 482 196 477 300
         C470 250 430 232 408 246 C402 214 360 206 360 206
         C360 206 318 214 312 246 C290 232 250 250 243 300 Z" fill="#2c2f3e"/>
<path d="M360 150 C312 150 270 186 256 252 C300 214 330 222 348 236 C346 196 360 168 360 150 Z" fill="#3a3e51"/>

<!-- eyebrows (slightly eager) -->
<path d="M286 268 q26 -16 56 -4" stroke="#3a2a20" stroke-width="9" fill="none" stroke-linecap="round"/>
<path d="M378 264 q30 -12 56 4" stroke="#3a2a20" stroke-width="9" fill="none" stroke-linecap="round"/>

<!-- eyes -->
<g>
  <ellipse cx="314" cy="304" rx="20" ry="23" fill="#ffffff"/>
  <ellipse cx="406" cy="304" rx="20" ry="23" fill="#ffffff"/>
  <circle cx="318" cy="307" r="12" fill="#2b2533"/>
  <circle cx="410" cy="307" r="12" fill="#2b2533"/>
  <circle cx="323" cy="302" r="4" fill="#ffffff"/>
  <circle cx="415" cy="302" r="4" fill="#ffffff"/>
</g>

<!-- cheeks -->
<circle cx="286" cy="346" r="20" fill="#F6A38B" opacity="0.45"/>
<circle cx="434" cy="346" r="20" fill="#F6A38B" opacity="0.45"/>

<!-- nose -->
<path d="M360 318 q10 18 -2 30" stroke="#D89A6E" stroke-width="7" fill="none" stroke-linecap="round"/>

<!-- big friendly smile -->
<path d="M300 360 Q360 432 420 360 Q392 392 360 392 Q328 392 300 360 Z" fill="#7a2f33"/>
<path d="M312 366 Q360 410 408 366 Q360 384 312 366 Z" fill="#ffffff"/>
<ellipse cx="360" cy="392" rx="18" ry="10" fill="#F0857F"/>

<!-- raised hand: "こう攻めましょう!" pointing finger -->
<g>
  <rect x="500" y="470" width="52" height="74" rx="26" fill="#EFBA8B"/>
  <rect x="512" y="396" width="26" height="92" rx="13" fill="url(#skin)"/>
  <circle cx="525" cy="396" r="14" fill="url(#skin)"/>
</g>
