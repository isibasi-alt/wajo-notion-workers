<h2>太陽光提案PDF: 売電制度・残存期間</h2>
<p class="subtitle">容量は DC容量 / PCS容量 を分ける方針で確定。次は売電制度まわりです。</p>

<div class="mockup">
  <div class="mockup-header">ここまでの必須候補</div>
  <div class="mockup-body">
    <div class="placeholder">
      <p>販売価格 / 仕入れ価格 / 年間売電収入</p>
      <p>パネルメーカー / パネル型式 / パネル枚数 / DC容量</p>
      <p>パワコンメーカー / パワコン型式 / PCS容量</p>
      <p>連系開始日 → 稼働年数を自動計算</p>
    </div>
  </div>
</div>

<div class="options">
  <div class="option" data-choice="fit-required" onclick="toggleSelect(this)">
    <div class="letter">A</div>
    <div class="content">
      <h3>FIT/FIP情報も必須</h3>
      <p>売電制度、売電単価、残存売電期間を必須化。収益の根拠が明確になる。</p>
    </div>
  </div>
  <div class="option" data-choice="fit-optional" onclick="toggleSelect(this)">
    <div class="letter">B</div>
    <div class="content">
      <h3>売電単価だけ必須</h3>
      <p>最低限の試算はできる。制度や残存期間が空ならPDFから除外または未確認にする。</p>
    </div>
  </div>
</div>
