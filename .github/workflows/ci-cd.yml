name: CI/CD

on:
  push:
  pull_request:
  workflow_dispatch: {} # 本番デプロイは手動トリガーのみ（自動デプロイはしない）

jobs:
  ci:
    name: CI (typecheck + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - name: Typecheck (tsc --noEmit)
        run: npm run check
      - name: Tests (主要・段階的に拡充)
        run: |
          npm run test:hitomi-evaluation-system
          npm run test:sales-performance-quantitative-score
          npm run test:monthly-eval-pdf
        # TODO: 全 test:* を集約する "npm test" を用意し、ここを1行にする

  deploy:
    name: CD (本番デプロイ) ※手動トリガー(workflow_dispatch)のみ
    needs: ci
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - name: カンベイ・ゲート（本物のOKでのみ deploy 解放）
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          KANBEI_BASE_REF: origin/main
        run: |
          git fetch origin main --depth=50 || true
          node scripts/kanbei-gate.mjs
      - name: Deploy (ntn workers)
        env:
          NOTION_KEYRING: "0" # キーチェーンでなくenvトークンで認証
          # ntn/@notionhq は NOTION_API_TOKEN / NOTION_TOKEN を読む（node_modules実物で確認）。
          # → 大ちゃんが GitHub Secrets に NOTION_API_TOKEN を追加（.env.worker.local の値）。
          #   ※ workers deploy の push 認証が専用トークンなら、それを足してここを差し替える（要・実機確認）。
          NOTION_API_TOKEN: ${{ secrets.NOTION_API_TOKEN }}
          NOTION_TOKEN: ${{ secrets.NOTION_API_TOKEN }}
        run: npx ntn workers deploy --local-build --no-git
